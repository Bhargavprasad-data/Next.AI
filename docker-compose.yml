version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ai_app_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_app
    networks:
      - ai_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_app_backend
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: ai_app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      VECTOR_DB_PATH: /app/vector_store
      EMBEDDING_MODEL: text-embedding-3-small
    volumes:
      - ./backend:/app
      - vector_store:/app/vector_store
    depends_on:
      - mongodb
    networks:
      - ai_app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_app_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - ai_app_network
    restart: unless-stopped

volumes:
  mongodb_data:
  vector_store:

networks:
  ai_app_network:
    driver: bridge


